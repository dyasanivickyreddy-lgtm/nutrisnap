<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="pepperGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#d50000"/>
      <stop offset="85%" stop-color="#9a0000"/>
      <stop offset="100%" stop-color="#600000"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b2a26" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#faf6f0"/>
  <g filter="url(#shadow)">
    <!-- Main Lobes -->
    <!-- Left Lobe -->
    <path d="M 195,130 C 130,120 90,165 90,240 C 90,300 120,335 155,340 C 185,345 198,320 195,130 Z" fill="url(#pepperGrad)"/>
    <!-- Right Lobe -->
    <path d="M 205,130 C 270,120 310,165 310,240 C 310,300 280,335 245,340 C 215,345 202,320 205,130 Z" fill="url(#pepperGrad)"/>
    <!-- Center Lobe -->
    <path d="M 160,135 C 180,125 220,125 240,135 C 255,200 245,330 200,348 C 155,330 145,200 160,135 Z" fill="url(#pepperGrad)"/>

    <!-- Stem & Calyx -->
    <path d="M 190,130 C 185,100 170,75 145,60 C 140,57 145,50 152,53 C 180,68 198,98 200,130 Z" fill="#2e7d32"/>
    <path d="M 170,135 C 180,120 220,120 230,135 C 220,145 180,145 170,135 Z" fill="#4caf50"/>

    <!-- Glossy Highlights -->
    <ellipse cx="140" cy="180" rx="22" ry="40" fill="#ffffff" opacity="0.25" transform="rotate(-15 140 180)"/>
    <ellipse cx="200" cy="190" rx="15" ry="35" fill="#ffffff" opacity="0.2" />
  </g>
</svg>
