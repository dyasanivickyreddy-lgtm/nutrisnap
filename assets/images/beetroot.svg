<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="beetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="45%" stop-color="#880e4f"/>
      <stop offset="85%" stop-color="#4a148c"/>
      <stop offset="100%" stop-color="#2a0033"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#880e4f"/>
      <stop offset="60%" stop-color="#ad1457"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b2a26" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#faf6f0"/>
  <g filter="url(#shadow)">
    <!-- Stems & Leaves -->
    <path d="M 180,160 Q 150,80 120,40 Q 160,70 188,150 Z" fill="url(#stemGrad)"/>
    <path d="M 200,150 Q 200,60 190,20 Q 215,60 208,150 Z" fill="url(#stemGrad)"/>
    <path d="M 220,160 Q 250,80 280,40 Q 240,70 212,150 Z" fill="url(#stemGrad)"/>
    <!-- Root Bulb -->
    <path d="M 200,140 C 280,140 325,185 325,245 C 325,300 270,335 205,355 C 200,357 198,375 197,385 C 196,375 194,357 189,354 C 125,335 75,300 75,245 C 75,185 120,140 200,140 Z" fill="url(#beetGrad)"/>
    <!-- Root Tail -->
    <path d="M 197,355 Q 190,375 180,390" fill="none" stroke="#4a148c" stroke-width="3" stroke-linecap="round"/>
    <!-- Highlight -->
    <ellipse cx="150" cy="210" rx="40" ry="25" fill="#ffffff" opacity="0.2" transform="rotate(-20 150 210)"/>
    <!-- Concentric Rings / Textures -->
    <path d="M 120,240 A 85,85 0 0,0 280,240" fill="none" stroke="#f8bbd0" stroke-width="2" opacity="0.25"/>
    <path d="M 140,265 A 60,60 0 0,0 260,265" fill="none" stroke="#f8bbd0" stroke-width="2" opacity="0.2"/>
  </g>
</svg>
