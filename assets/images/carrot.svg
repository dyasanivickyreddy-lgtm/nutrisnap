<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="50%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <linearGradient id="topGreen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b2a26" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#faf6f0"/>
  <g filter="url(#shadow)" transform="rotate(25 200 200)">
    <!-- Leafy Top -->
    <path d="M 180,120 Q 150,50 110,30 Q 140,70 170,110 Z" fill="url(#topGreen)"/>
    <path d="M 200,115 Q 200,30 190,10 Q 210,40 205,110 Z" fill="url(#topGreen)"/>
    <path d="M 220,120 Q 250,50 290,30 Q 260,70 230,110 Z" fill="url(#topGreen)"/>
    <!-- Carrot Body -->
    <path d="M 155,120 C 160,110 240,110 245,120 C 255,160 220,310 203,375 C 200,385 198,385 195,375 C 178,310 145,160 155,120 Z" fill="url(#carrotGrad)"/>
    <!-- Highlight -->
    <path d="M 170,135 C 168,160 175,230 185,280" fill="none" stroke="#ffe0b2" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
    <!-- Ridges / Texture -->
    <path d="M 165,150 Q 190,158 230,152" fill="none" stroke="#bf360c" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <path d="M 168,190 Q 195,198 225,192" fill="none" stroke="#bf360c" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <path d="M 175,240 Q 198,246 218,242" fill="none" stroke="#bf360c" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
    <path d="M 182,290 Q 198,294 210,292" fill="none" stroke="#bf360c" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  </g>
</svg>
