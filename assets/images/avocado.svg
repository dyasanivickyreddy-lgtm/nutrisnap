<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="avoFlesh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f4c3"/>
      <stop offset="60%" stop-color="#c0ca33"/>
      <stop offset="90%" stop-color="#558b2f"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </radialGradient>
    <radialGradient id="avoPit" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="50%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f1a17" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#0f1a17"/>
  <g filter="url(#shadow)">
    <!-- Outer Skin & Flesh -->
    <path d="M 200,60 C 260,60 310,130 310,230 C 310,315 260,355 200,355 C 140,355 90,315 90,230 C 90,130 140,60 200,60 Z" fill="url(#avoFlesh)"/>
    <!-- Pit -->
    <circle cx="200" cy="245" r="50" fill="url(#avoPit)"/>
    <!-- Pit Highlight -->
    <ellipse cx="185" cy="230" rx="14" ry="8" fill="#ffffff" opacity="0.3" transform="rotate(-25 185 230)"/>
  </g>
</svg>
