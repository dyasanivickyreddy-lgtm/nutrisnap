<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="mushCap" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="50%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </radialGradient>
    <linearGradient id="mushStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f1a17" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#0f1a17"/>
  <g filter="url(#shadow)">
    <!-- Stem -->
    <path d="M 165,220 C 165,330 235,330 235,220 Z" fill="url(#mushStem)"/>
    <!-- Cap -->
    <path d="M 80,220 C 80,100 320,100 320,220 C 320,230 80,230 80,220 Z" fill="url(#mushCap)"/>
    <!-- Highlight -->
    <ellipse cx="160" cy="150" rx="45" ry="25" fill="#ffffff" opacity="0.25" transform="rotate(-15 160 150)"/>
  </g>
</svg>
