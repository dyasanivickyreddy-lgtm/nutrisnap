<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="pumpkinCenter" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="50%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <radialGradient id="pumpkinRib" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffa726"/>
      <stop offset="70%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#ef6c00"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b2a26" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#faf6f0"/>
  <g filter="url(#shadow)">
    <!-- Stem -->
    <path d="M 190,140 Q 180,90 220,60 Q 225,58 222,65 Q 198,95 205,140 Z" fill="#4e342e"/>
    <path d="M 200,140 Q 205,95 228,68 Q 232,66 230,72 Q 212,98 210,140 Z" fill="#6d4c41"/>

    <!-- Pumpkin Ribs Background Outer -->
    <ellipse cx="120" cy="240" rx="65" ry="95" fill="url(#pumpkinRib)" transform="rotate(-15 120 240)"/>
    <ellipse cx="280" cy="240" rx="65" ry="95" fill="url(#pumpkinRib)" transform="rotate(15 280 240)"/>

    <!-- Inner Ribs -->
    <ellipse cx="155" cy="245" rx="60" ry="102" fill="url(#pumpkinRib)" transform="rotate(-8 155 245)"/>
    <ellipse cx="245" cy="245" rx="60" ry="102" fill="url(#pumpkinRib)" transform="rotate(8 245 245)"/>

    <!-- Center Rib -->
    <ellipse cx="200" cy="248" rx="62" ry="105" fill="url(#pumpkinCenter)"/>

    <!-- Top Stem Cap -->
    <path d="M 180,142 C 190,135 210,135 220,142 C 215,150 185,150 180,142 Z" fill="#3e2723"/>

    <!-- Highlights -->
    <ellipse cx="185" cy="180" rx="25" ry="12" fill="#ffffff" opacity="0.25" transform="rotate(-15 185 180)"/>
    <ellipse cx="215" cy="182" rx="20" ry="10" fill="#ffffff" opacity="0.2" transform="rotate(15 215 182)"/>
  </g>
</svg>
