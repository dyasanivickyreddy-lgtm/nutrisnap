<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="tomatoGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6b52"/>
      <stop offset="45%" stop-color="#e63926"/>
      <stop offset="85%" stop-color="#b81b09"/>
      <stop offset="100%" stop-color="#800e02"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b2a26" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="32" fill="#faf6f0"/>
  <g filter="url(#shadow)">
    <!-- Main Body -->
    <path d="M 200,95 C 290,95 340,150 340,240 C 340,315 285,345 200,345 C 115,345 60,315 60,240 C 60,150 110,95 200,95 Z" fill="url(#tomatoGrad)"/>
    <!-- Highlight -->
    <ellipse cx="140" cy="160" rx="45" ry="30" fill="#ffffff" opacity="0.28" transform="rotate(-25 140 160)"/>
    <ellipse cx="125" cy="148" rx="16" ry="9" fill="#ffffff" opacity="0.45" transform="rotate(-25 125 148)"/>
    <!-- Calyx / Stem Leaves -->
    <path d="M 200,105 L 180,60 L 195,95 L 150,75 L 185,102 L 135,115 L 182,118 L 175,145 L 195,122 L 200,155 L 205,122 L 225,145 L 218,118 L 265,115 L 215,102 L 250,75 L 205,95 L 220,60 Z" fill="url(#leafGrad)"/>
    <!-- Stem -->
    <path d="M 194,75 C 192,50 196,40 210,32 C 214,30 212,24 206,26 C 188,34 184,52 188,75 Z" fill="#2e7d32"/>
  </g>
</svg>
